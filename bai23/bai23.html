<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 23 — Thư viện ảnh hiệu ứng Hover</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="gallery-wrapper">
        <!-- Tiêu đề và mô tả -->
        <header class="gallery-header">
            <h1 class="gallery-title">Thư viện ảnh — Hiệu ứng Hover</h1>
            <p class="gallery-subtitle">Rê chuột lên ảnh để thấy hiệu ứng phóng to (zoom) và lớp phủ chú thích.</p>
        </header>

        <!-- Lưới 6 ảnh danh thắng Việt Nam -->
        <div class="gallery-grid">
            <!-- 1. Vịnh Hạ Long -->
            <div class="gallery-card">
                <img src="../Anh/Bai23/1-vinh-ha-long.jpg" alt="Vịnh Hạ Long" class="gallery-img">
                <div class="gallery-overlay">
                    <span class="place-name">Vịnh Hạ Long</span>
                </div>
            </div>

            <!-- 2. Hang Sơn Đoòng -->
            <div class="gallery-card">
                <img src="../Anh/Bai23/2-son-doong.jpg" alt="Hang Sơn Đoòng" class="gallery-img">
                <div class="gallery-overlay">
                    <span class="place-name">Hang Sơn Đoòng</span>
                </div>
            </div>

            <!-- 3. Thác Bản Giốc -->
            <div class="gallery-card">
                <img src="../Anh/Bai23/3-thac-ban-gioc.jpg" alt="Thác Bản Giốc" class="gallery-img">
                <div class="gallery-overlay">
                    <span class="place-name">Thác Bản Giốc</span>
                </div>
            </div>

            <!-- 4. Fansipan -->
            <div class="gallery-card">
                <img src="../Anh/Bai23/4-fansipan.jpg" alt="Fansipan" class="gallery-img">
                <div class="gallery-overlay">
                    <span class="place-name">Fansipan</span>
                </div>
            </div>

            <!-- 5. Đồng bằng sông Cửu Long -->
            <div class="gallery-card">
                <img src="../Anh/Bai23/5-mekong.jpg" alt="Đồng bằng sông Cửu Long" class="gallery-img">
                <div class="gallery-overlay">
                    <span class="place-name">Đồng bằng sông Cửu Long</span>
                </div>
            </div>

            <!-- 6. Động Phong Nha -->
            <div class="gallery-card">
                <img src="../Anh/Bai23/6-phong-nha.jpg" alt="Động Phong Nha" class="gallery-img">
                <div class="gallery-overlay">
                    <span class="place-name">Động Phong Nha</span>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
