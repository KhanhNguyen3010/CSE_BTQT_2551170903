<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bốn Mùa</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="khung-bai">
      <h1 class="tieu-de">BỐN MÙA</h1>
      <p class="kho-xanh">
        Xuân về hoa nở khắp trời <br />
        Hạ sang nắng cháy rạng người phố quen <br />
        Thu về lá rụng bên thềm
      </p>

      <hr class="duong-ngan" />
      <p class="kho-do">
        Đông sang gió lạnh bên em đợi chờ <br />
        Bốn mùa là bốn giấc mơ <br />
        Thời gian đi mãi ta chờ đợi ai
      </p>

      <hr class="duong-ngan" />

      <p class="kho-xanh">
        Một năm rồi lại một năm <br />
        Vẫn còn câu hát thì thầm quê hương <br />
        Chờ xuân nắng mới soi đường
      </p>
    </div>
  </body>
</html>
