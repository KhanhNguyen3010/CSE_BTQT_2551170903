<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 30 — Bảng điều khiển (Bootstrap)</title>
    <!-- Bootstrap 5 CSS qua CDN theo yêu cầu -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">
    <div class="d-flex flex-column flex-md-row min-vh-100">
        <!-- 1. SIDEBAR MENU DỌC (RỘNG 230px, NỀN #212529, CHỮ #FFFFFF) -->
        <aside class="sidebar p-3 text-white flex-shrink-0">
            <!-- Brand -->
            <div class="sidebar-brand fw-bold fs-6 pb-3 mb-3 border-bottom border-secondary border-opacity-25">
                CSE.TLU Admin
            </div>

            <!-- Menu dọc -->
            <ul class="nav nav-pills flex-column gap-1">
                <li class="nav-item">
                    <a href="#" class="nav-link active fw-medium" aria-current="page">Bảng điều khiển</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link text-white-50">Bài tập</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link text-white-50">Sinh viên</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link text-white-50">Điểm số</a>
                </li>
            </ul>
        </aside>

        <!-- 2. NỘI DUNG CHÍNH (CONTENT AREA) -->
        <main class="content-area flex-grow-1 p-3 p-md-4">
            <div class="container-fluid px-0">
                <!-- Header khu vực nội dung -->
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                    <h4 class="fw-bold text-dark mb-0">Bảng điều khiển</h4>
                    <div class="d-flex align-items-center gap-2">
                        <span class="badge text-dark fw-bold px-3 py-2 rounded-2 badge-notice">3 bài mới</span>
                        <button class="btn btn-primary btn-sm px-3 py-2 fw-semibold">Xuất báo cáo</button>
                    </div>
                </div>

                <!-- 3. LƯỚI 4 THẺ THỐNG KÊ (col-sm-6 col-xl-3, shadow-sm, border-0) -->
                <div class="row g-3 mb-4">
                    <!-- Thẻ 1: Sinh viên -->
                    <div class="col-sm-6 col-xl-3">
                        <div class="card stat-card shadow-sm border-0 rounded-3 p-3 bg-white h-100">
                            <span class="text-secondary small fw-medium">Sinh viên</span>
                            <div class="fs-2 fw-bold text-dark my-1">128</div>
                            <div class="progress stat-progress">
                                <div class="progress-bar bg-primary" role="progressbar" style="width: 75%;" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Thẻ 2: Đã nộp -->
                    <div class="col-sm-6 col-xl-3">
                        <div class="card stat-card shadow-sm border-0 rounded-3 p-3 bg-white h-100">
                            <span class="text-secondary small fw-medium">Đã nộp</span>
                            <div class="fs-2 fw-bold text-dark my-1">96</div>
                            <div class="progress stat-progress">
                                <div class="progress-bar progress-bar-success" role="progressbar" style="width: 75%;" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Thẻ 3: Chưa nộp -->
                    <div class="col-sm-6 col-xl-3">
                        <div class="card stat-card shadow-sm border-0 rounded-3 p-3 bg-white h-100">
                            <span class="text-secondary small fw-medium">Chưa nộp</span>
                            <div class="fs-2 fw-bold text-dark my-1">32</div>
                            <div class="progress stat-progress">
                                <div class="progress-bar progress-bar-danger" role="progressbar" style="width: 25%;" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Thẻ 4: Điểm TB -->
                    <div class="col-sm-6 col-xl-3">
                        <div class="card stat-card shadow-sm border-0 rounded-3 p-3 bg-white h-100">
                            <span class="text-secondary small fw-medium">Điểm TB</span>
                            <div class="fs-2 fw-bold text-dark my-1">7.8</div>
                            <div class="progress stat-progress">
                                <div class="progress-bar progress-bar-warning" role="progressbar" style="width: 78%;" aria-valuenow="78" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 4. DANH SÁCH TIẾN ĐỘ THEO CHƯƠNG -->
                <div class="card shadow-sm border-0 rounded-3 overflow-hidden bg-white">
                    <div class="card-header bg-white py-3 border-bottom border-light-subtle">
                        <h6 class="fw-bold mb-0 text-dark">Tiến độ theo chương</h6>
                    </div>
                    <ul class="list-group list-group-flush chapter-list">
                        <!-- Chương 1 -->
                        <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                            <span class="text-dark fw-medium">Chương 1 — HTML5</span>
                            <span class="badge badge-rate badge-green rounded-2 px-3 py-2 fw-bold">100%</span>
                        </li>

                        <!-- Chương 2 -->
                        <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                            <span class="text-dark fw-medium">Chương 2 — JavaScript</span>
                            <span class="badge badge-rate badge-blue rounded-2 px-3 py-2 fw-bold">82%</span>
                        </li>

                        <!-- Chương 3 -->
                        <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                            <span class="text-dark fw-medium">Chương 3 — CSS3</span>
                            <span class="badge badge-rate badge-cyan rounded-2 px-3 py-2 fw-bold">74%</span>
                        </li>

                        <!-- Chương 4 -->
                        <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                            <span class="text-dark fw-medium">Chương 4 — Bootstrap 5</span>
                            <span class="badge badge-rate badge-gray rounded-2 px-3 py-2 fw-bold">45%</span>
                        </li>
                    </ul>
                </div>
            </div>
        </main>
    </div>

    <!-- Bootstrap 5 JS Bundle qua CDN theo yêu cầu -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
