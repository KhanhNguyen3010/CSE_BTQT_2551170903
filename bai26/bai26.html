<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 26 — Form đăng ký với Bootstrap</title>
    <!-- Bootstrap 5 CSS qua CDN theo yêu cầu -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light min-vh-100 d-flex justify-content-center align-items-center py-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <!-- Thẻ Form: nền #FFFFFF, bóng đổ, bo góc -->
                <div class="card shadow border-0 rounded-3 overflow-hidden">
                    <!-- Tiêu đề thẻ: nền #198754 (bg-success), chữ trắng, căn giữa -->
                    <div class="card-header bg-success text-white text-center py-3">
                        <h4 class="mb-0 fw-bold">Đăng ký tham gia CLB Lập trình Web</h4>
                    </div>

                    <!-- Thân Form -->
                    <div class="card-body p-4">
                        <form action="#" method="POST" class="needs-validation" novalidate>
                            <div class="row g-3">
                                <!-- Họ và tên -->
                                <div class="col-md-6">
                                    <label for="fullname" class="form-label fw-semibold">Họ và tên</label>
                                    <input type="text" class="form-control" id="fullname" placeholder="Nguyễn Văn A" required>
                                </div>

                                <!-- Mã sinh viên -->
                                <div class="col-md-6">
                                    <label for="studentId" class="form-label fw-semibold">Mã sinh viên</label>
                                    <input type="text" class="form-control" id="studentId" placeholder="22xxxxxx" required>
                                </div>

                                <!-- Email -->
                                <div class="col-md-6">
                                    <label for="email" class="form-label fw-semibold">Email</label>
                                    <input type="email" class="form-control" id="email" placeholder="sv@tlu.edu.vn" required>
                                </div>

                                <!-- Số điện thoại -->
                                <div class="col-md-6">
                                    <label for="phone" class="form-label fw-semibold">Số điện thoại</label>
                                    <input type="tel" class="form-control" id="phone" placeholder="09xxxxxxxx">
                                </div>

                                <!-- Trình độ (Radio inline) -->
                                <div class="col-12">
                                    <label class="form-label fw-semibold d-block">Trình độ</label>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="level" id="levelBasic" value="basic" checked>
                                        <label class="form-check-label" for="levelBasic">Cơ bản</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="level" id="levelIntermediate" value="intermediate">
                                        <label class="form-check-label" for="levelIntermediate">Khá</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="level" id="levelAdvanced" value="advanced">
                                        <label class="form-check-label" for="levelAdvanced">Tốt</label>
                                    </div>
                                </div>

                                <!-- Chọn lớp (Select) -->
                                <div class="col-12">
                                    <label for="classSelect" class="form-label fw-semibold">Chọn lớp</label>
                                    <select class="form-select" id="classSelect" required>
                                        <option value="67CNTT1" selected>67CNTT1</option>
                                        <option value="67CNTT2">67CNTT2</option>
                                        <option value="67KTPM1">67KTPM1</option>
                                        <option value="67KTPM2">67KTPM2</option>
                                    </select>
                                </div>

                                <!-- Cam kết (Checkbox) -->
                                <div class="col-12">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="agreement" checked required>
                                        <label class="form-check-label" for="agreement">
                                            Tôi cam kết tự làm bài và quay video OBS
                                        </label>
                                    </div>
                                </div>

                                <!-- Nút Nhập lại và Đăng ký (căn phải) -->
                                <div class="col-12 d-flex justify-content-end gap-2 pt-2">
                                    <button type="reset" class="btn btn-outline-secondary px-3">Nhập lại</button>
                                    <button type="submit" class="btn btn-success px-4 fw-semibold">Đăng ký</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS qua CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
